# Локальный профиль: --spring.profiles.active=local (scripts/run-local.sh)
# Секреты: deploy/local.env (см. deploy/local.env.example) — не коммитить токены сюда
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/predicts_local}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}

bot:
  username: ${BOT_USERNAME:}
  token: ${BOT_TOKEN:}
  chatId: ${BOT_CHAT_ID:}
  webAppUrl: ${BOT_WEBAPP_URL:}

miniapp:
  dev-mode: true
  dev-telegram-id: ${MINIAPP_DEV_TELEGRAM_ID:}

predictions:
  startup:
    # false — не гонять пересчёт по продовой БД при каждом локальном старте
    recalculate: false
    sync-match-times: false

api:
  football:
    token: ${API_FOOTBALL_TOKEN:}

# HTTPS для Telegram Mini App: ./scripts/dev-https.sh → deploy/local-https.env
