server:
  port: 8080
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/predicts_test}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driverClassName: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-test-query: SELECT 1
  main:
    banner-mode: off
  task:
    scheduling:
      pool:
        size: 5
      time-zone: Europe/Moscow

bot:
  username: ${BOT_USERNAME:}
  token: ${BOT_TOKEN:}
  chatId: ${BOT_CHAT_ID:}
  webAppUrl: ${BOT_WEBAPP_URL:}
  urlMessage: https://api.telegram.org/bot${bot.token}/sendMessage
  urlPhoto: https://api.telegram.org/bot${bot.token}/sendPhoto
  urlEditMessage: https://api.telegram.org/bot${bot.token}/editMessageText

chatId: ${ADMIN_CHAT_ID:}

api:
  football:
    token: ${API_FOOTBALL_TOKEN:}

season: ${SEASON:2026}

logging:
  level:
    org:
      springframework:
        security: INFO
