<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPL Predictions</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
    <header class="header">
        <div class="header-avatar" aria-hidden="true">&#9917;</div>
        <div class="header-text">
            <h1 id="app-title">EPL Predictions</h1>
            <p id="user-greeting">Загрузка…</p>
        </div>
    </header>

    <main id="screen-stats" class="screen active">
        <div class="segmented">
            <button class="segmented-btn active" data-leaderboard="">Общий</button>
            <button class="segmented-btn" data-leaderboard="current">Текущий тур</button>
        </div>
        <section class="card">
            <h2 class="card-title" id="leaderboard-title">Зачёт</h2>
            <ul id="leaderboard-list" class="list"></ul>
        </section>
        <section class="card">
            <h2 class="card-title">График очков по турам</h2>
            <div class="chart-wrap">
                <canvas id="points-chart" height="200"></canvas>
            </div>
            <ul id="chart-legend" class="chart-legend"></ul>
        </section>
        <section class="card">
            <h2 class="card-title">Таблица АПЛ</h2>
            <div class="table-wrap">
                <table class="standings-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Клуб</th>
                        <th>И</th>
                        <th>О</th>
                    </tr>
                    </thead>
                    <tbody id="standings-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <main id="screen-today" class="screen">
        <section class="card">
            <h2 class="card-title">Матчи сегодня</h2>
            <ul id="today-match-list" class="list"></ul>
        </section>
    </main>

    <main id="screen-predict" class="screen">
        <div id="predict-weeks" class="week-grid"></div>
        <div id="predict-matches" class="hidden">
            <button class="back-link" id="predict-back-weeks">&#8592; Выбор тура</button>
            <h2 class="section-title" id="predict-week-title"></h2>
            <ul id="predict-match-list" class="list"></ul>
        </div>
    </main>

    <main id="screen-my" class="screen">
        <div id="my-weeks" class="week-grid"></div>
        <div id="my-predictions" class="hidden">
            <button class="back-link" id="my-back-weeks">&#8592; Выбор тура</button>
            <h2 class="section-title" id="my-week-title"></h2>
            <ul id="my-prediction-list" class="list"></ul>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-screen="stats">
            <span class="nav-icon">&#128202;</span>
            <span>Зачёт</span>
        </button>
        <button class="nav-btn" data-screen="today">
            <span class="nav-icon">&#128197;</span>
            <span>Сегодня</span>
        </button>
        <button class="nav-btn" data-screen="predict">
            <span class="nav-icon">&#127919;</span>
            <span>Прогноз</span>
        </button>
        <button class="nav-btn" data-screen="my">
            <span class="nav-icon">&#128203;</span>
            <span>Мои</span>
        </button>
    </nav>
</div>

<div id="score-modal" class="modal hidden">
    <div class="modal-sheet">
        <div class="modal-header">
            <h3 id="modal-match-title">Матч</h3>
            <button id="modal-close" class="icon-btn" aria-label="Закрыть">&#10005;</button>
        </div>
        <p id="modal-kickoff" class="modal-sub"></p>
        <div id="score-grid" class="score-grid"></div>
        <button id="modal-delete" class="btn-danger hidden">Удалить прогноз</button>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
