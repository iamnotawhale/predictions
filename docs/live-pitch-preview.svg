  <rect x="864" y="120" width="88" height="570" fill="#2d9150"/>
  <rect x="952" y="120" width="88" height="570" fill="#287f46"/>

  <rect x="160" y="120" width="880" height="570" rx="2" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="2"/>
