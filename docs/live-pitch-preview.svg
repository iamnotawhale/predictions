        stroke="rgba(18,20,24,0.88)" stroke-width="3" stroke-linecap="round"/>
  <!-- block → ball (neutral dark) -->
  <line x1="995.12" y1="492.78" x2="1040" y2="394.74"
        stroke="rgba(18,20,24,0.72)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 2) fieldEnd — block (away kit) -->
  <circle cx="995.12" cy="492.78" r="6" fill="#f5f5f8" stroke="rgba(0,0,0,0.45)" stroke-width="1.5"/>

  <!-- 3) goalPositionY — ball icon -->
