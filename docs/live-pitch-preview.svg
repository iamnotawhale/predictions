  <path d="M1040 387 L1046 392 L1044 400 L1036 400 L1034 392 Z"
        fill="none" stroke="rgba(20,20,20,0.8)" stroke-width="1.1"/>

  <!-- 1) fieldStart — shot (home kit) -->
