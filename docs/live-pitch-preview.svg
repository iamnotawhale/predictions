       fieldStart 89/84.9 → fieldEnd 94.9/65.4 → goalMouth y=48.2
       lines: neutral dark gray; dots: team kit colors; end: ball icon
       badge: surname/nickname (Jensen), not first name -->

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect x="120" y="80" width="960" height="660" rx="24" fill="#1f2a36" stroke="rgba(255,255,255,0.14)"/>

  <rect x="160" y="120" width="880" height="570" rx="2" fill="#2b884b" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
