name: CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'application.yml'
      - 'application-prod.yml'
      - 'deploy/predicts.service'
      - 'deploy/upload-jar.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Mini App JS tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java unit tests
        # Card preview test needs Chrome + network (it only writes preview PNGs), so it is not a gate.
        run: mvn -B test -Dtest='!HtmlCardPreviewTest'

      - name: Mini App JS tests
        run: node --test "src/test/js/*.test.js"

      - name: Build jar
        run: mvn -B -DskipTests package

      - name: Upload jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: predictions-jar
          path: target/predictions-1.0.0.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: predictions-jar
          path: target

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          PORT="${PROD_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "$PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${PROD_HOST}
            Port ${PORT}
            User ${PROD_USER}
            IdentityFile ~/.ssh/prod_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy jar with rollback
        env:
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          APP_DIR="${PROD_APP_DIR:?}"
          DEPLOY_USER="${PROD_USER:?}"
          JAR=target/predictions-1.0.0.jar
          test -s "$JAR"
          sed -e "s|REPLACE_USER|${DEPLOY_USER}|g" \
              -e "s|/path/to/predictions|${APP_DIR}|g" \
              deploy/predicts.service > /tmp/predicts.service

          healthy() {
            ssh prod 'for i in $(seq 1 30); do
              if systemctl is-active --quiet predicts && curl -sf -o /dev/null http://127.0.0.1:8080/miniapp/; then
                echo "healthy after ${i} checks"; exit 0
              fi
              sleep 3
            done
            exit 1'
          }

          ssh prod "sudo systemctl stop predicts 2>/dev/null || true; mkdir -p '${APP_DIR}/target' '${APP_DIR}/deploy'"
          ssh prod "if test -f '${APP_DIR}/target/predictions-1.0.0.jar'; then cp -a '${APP_DIR}/target/predictions-1.0.0.jar' '${APP_DIR}/target/predictions-1.0.0.jar.bak'; fi"
          scp "$JAR" "prod:${APP_DIR}/target/predictions-1.0.0.jar.new"
          scp /tmp/predicts.service "prod:${APP_DIR}/deploy/predicts.service"
          ssh prod "mv -f '${APP_DIR}/target/predictions-1.0.0.jar.new' '${APP_DIR}/target/predictions-1.0.0.jar' && unzip -tq '${APP_DIR}/target/predictions-1.0.0.jar' >/dev/null"
          ssh prod "sudo install -m 644 '${APP_DIR}/deploy/predicts.service' /etc/systemd/system/predicts.service && sudo systemctl daemon-reload && sudo systemctl reset-failed predicts 2>/dev/null || true; sudo systemctl start predicts || true"

          if healthy; then
            echo "deploy ok"
            exit 0
          fi

          echo "health check failed, rolling back"
          ssh prod "sudo systemctl stop predicts 2>/dev/null || true; if test -f '${APP_DIR}/target/predictions-1.0.0.jar.bak'; then cp -a '${APP_DIR}/target/predictions-1.0.0.jar.bak' '${APP_DIR}/target/predictions-1.0.0.jar'; fi; sudo systemctl start predicts || true" || true
          ssh prod 'journalctl -u predicts -n 60 --no-pager' || true
          healthy && echo "rollback healthy" || echo "rollback NOT healthy: prod is down"
          exit 1
