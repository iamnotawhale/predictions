name: CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'application.yml'
      - 'application-prod.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Mini App JS tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java unit tests
        # Card preview test needs Chrome + network (it only writes preview PNGs), so it is not a gate.
        run: mvn -B test -Dtest='!HtmlCardPreviewTest'

      - name: Mini App JS tests
        run: node --test "src/test/js/*.test.js"

      - name: Build jar
        run: mvn -B -DskipTests package

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          PORT="${PROD_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "$PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${PROD_HOST}
            Port ${PORT}
            User ${PROD_USER}
            IdentityFile ~/.ssh/prod_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 600 ~/.ssh/config

      - name: Request build on odyssey and wait
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh prod "mkdir -p ~/.local/state/predicts-build && rm -f ~/.local/state/predicts-build/failed && echo '$SHA' > ~/.local/state/predicts-build/requested && sudo -n systemctl start --no-block predicts-deploy.service"
          deadline=$(( $(date +%s) + 3600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            state=$(ssh prod 'cd ~/.local/state/predicts-build && printf "installed=%s failed=%s status=%s unit=%s" "$(cat installed 2>/dev/null)" "$(cat failed 2>/dev/null)" "$(cat status 2>/dev/null)" "$(systemctl is-active predicts-deploy.service)"')
            echo "$state"
            case "$state" in
              *"installed=$SHA"*) echo "deployed $SHA"; exit 0 ;;
              *"failed=$SHA"*) echo "deploy failed, see odyssey log"; exit 1 ;;
              *"status=waiting"*) echo "отложено до конца матча: odyssey установит коммит после игр"; exit 0 ;;
            esac
            if [[ "$state" == *"unit=failed"* ]]; then echo "unit failed"; exit 1; fi
            sleep 30
          done
          echo "timed out waiting for odyssey"; exit 1
