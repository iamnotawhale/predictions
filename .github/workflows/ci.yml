name: CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'application.yml'
      - 'application-prod.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Mini App JS tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java unit tests
        # Card preview test needs Chrome + network (it only writes preview PNGs), so it is not a gate.
        run: mvn -B test -Dtest='!HtmlCardPreviewTest'

      - name: Mini App JS tests
        run: node --test "src/test/js/*.test.js"

      - name: Build jar
        run: mvn -B -DskipTests package
