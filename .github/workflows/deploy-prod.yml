name: Deploy to prod

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'application.yml'
      - 'application-prod.yml'
      - 'deploy/predicts.service'
      - 'deploy/upload-jar.sh'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run: mvn -B -DskipTests package

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          PORT="${PROD_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "$PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${PROD_HOST}
            Port ${PORT}
            User ${PROD_USER}
            IdentityFile ~/.ssh/prod_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy jar and restart
        env:
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          APP_DIR="${PROD_APP_DIR:?}"
          DEPLOY_USER="${PROD_USER:?}"
          JAR=target/predictions-1.0.0.jar
          test -s "$JAR"
          # unit from template
          sed -e "s|REPLACE_USER|${DEPLOY_USER}|g" \
              -e "s|/path/to/predictions|${APP_DIR}|g" \
              deploy/predicts.service > /tmp/predicts.service

          ssh prod "sudo systemctl stop predicts 2>/dev/null || true; mkdir -p '${APP_DIR}/target' '${APP_DIR}/deploy'"
          ssh prod "if test -f '${APP_DIR}/target/predictions-1.0.0.jar'; then cp -a '${APP_DIR}/target/predictions-1.0.0.jar' '${APP_DIR}/target/predictions-1.0.0.jar.bak'; fi"
          scp "$JAR" "prod:${APP_DIR}/target/predictions-1.0.0.jar.new"
          scp /tmp/predicts.service "prod:${APP_DIR}/deploy/predicts.service"
          ssh prod "mv -f '${APP_DIR}/target/predictions-1.0.0.jar.new' '${APP_DIR}/target/predictions-1.0.0.jar' && jar tf '${APP_DIR}/target/predictions-1.0.0.jar' >/dev/null"
          ssh prod "sudo install -m 644 '${APP_DIR}/deploy/predicts.service' /etc/systemd/system/predicts.service && sudo systemctl daemon-reload && sudo systemctl reset-failed predicts 2>/dev/null || true; sudo systemctl start predicts"
          # Spring Boot often needs >8s; wait up to ~90s for active + miniapp
          ssh prod 'for i in $(seq 1 30); do
            if systemctl is-active --quiet predicts && curl -sf -o /dev/null http://127.0.0.1:8080/miniapp/; then
              echo "healthy after ${i} checks"
              exit 0
            fi
            echo "wait $i: $(systemctl is-active predicts 2>/dev/null || true)"
            sleep 3
          done
          systemctl --no-pager -l status predicts || true
          journalctl -u predicts -n 80 --no-pager || true
          exit 1'
