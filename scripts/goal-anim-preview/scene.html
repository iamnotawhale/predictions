<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet"/><style>
:root{--a:#b08cff;--al:#c9b4ff;--ad:#6b4fc4;--hot:#ffd166;--bg:#070b16;--bg2:#0d1426;--w:#fff}
body.no{--a:#ff5a6e;--al:#ffb0ba;--ad:#8c1f2e;--hot:#ff8a98}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:480px;height:480px;overflow:hidden;background:var(--bg);font-family:"Manrope","DejaVu Sans",sans-serif;color:var(--w)}
.stage{position:relative;width:480px;height:480px;overflow:hidden;background:
 radial-gradient(ellipse 80% 55% at 50% -10%,color-mix(in srgb,var(--a) 30%,transparent),transparent 70%),
 radial-gradient(ellipse 60% 40% at 100% 100%,color-mix(in srgb,var(--a) 14%,transparent),transparent 55%),var(--bg)}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px;opacity:.7;animation:gridmove 2.8s linear both}
@keyframes gridmove{from{transform:translateY(0)}to{transform:translateY(40px)}}
/* wipe slabs */
.slab{position:absolute;top:-20px;bottom:-20px;width:70%;left:-80%;transform:skewX(-18deg);background:linear-gradient(90deg,var(--ad),var(--a));animation:slab 0.9s cubic-bezier(.77,0,.18,1) both}
.slab.s2{background:var(--w);width:18%;animation:slab2 0.9s .05s cubic-bezier(.77,0,.18,1) both}
@keyframes slab{0%{left:-80%}50%{left:15%}100%{left:130%}}
@keyframes slab2{0%{left:-40%}50%{left:30%}100%{left:140%}}
.flash{position:absolute;inset:0;background:var(--hot);opacity:0;animation:flash .5s .38s ease-out both}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
/* stinger */
.title{position:absolute;left:0;right:0;top:34px;text-align:center;font-weight:900;font-size:92px;letter-spacing:.04em;font-style:italic;transform-origin:50% 60%;
 text-shadow:0 0 30px color-mix(in srgb,var(--a) 70%,transparent),0 4px 0 var(--ad);animation:title 2.8s both}
.title span{display:inline-block;animation:letter .5s both;animation-delay:calc(.45s + var(--i)*70ms)}
@keyframes letter{from{opacity:0;transform:translateY(40px) skewX(-14deg) scale(1.4)}to{opacity:1;transform:none}}
@keyframes title{0%,15%{opacity:0}16%{opacity:1}78%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(.72) translateY(-22px)}}
.rule{position:absolute;left:60px;right:60px;top:148px;height:4px;background:var(--hot);transform:scaleX(0);transform-origin:left;animation:rule .6s .85s cubic-bezier(.23,1,.32,1) both,rule2 .5s 2.1s ease-in both}
@keyframes rule{to{transform:scaleX(1)}}@keyframes rule2{from{opacity:1}to{opacity:0}}
/* scorebug — same hero slab as the broadcast result card */
.bug{position:absolute;left:24px;right:24px;top:180px;height:120px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:0 12px;
 border-left:8px solid var(--a);border-radius:4px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5);
 background:linear-gradient(90deg,#0d1426 0%,color-mix(in srgb,var(--a) 48%,#0d1426) 50%,#0d1426 100%);
 transform:translateY(40px);opacity:0;animation:bug .6s 1s cubic-bezier(.34,1.3,.5,1) both}
@keyframes bug{to{transform:none;opacity:1}}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;color:#0d1426;display:flex;align-items:center;justify-content:center;font-family:"Unbounded",sans-serif;font-weight:700;font-size:19px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.code{font-family:"Unbounded",sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em}
.team.scorer .logo{animation:logoPop .6s 1.7s cubic-bezier(.34,1.6,.5,1) both}
@keyframes logoPop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.mid{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;font-family:"Unbounded",sans-serif;font-weight:700;font-size:58px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;padding:0 8px}
.digit{height:66px;overflow:hidden;width:42px;text-align:center}
.reel{display:flex;flex-direction:column}
.reel b{height:66px;line-height:66px;font-weight:700}
.reel.roll{animation:roll .55s 1.7s cubic-bezier(.34,1.5,.5,1) both}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-66px)}}
.punch{animation:punch .5s 1.7s cubic-bezier(.34,1.6,.5,1) both}
@keyframes punch{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.sep{opacity:.9;margin:0 -2px}
.bug::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sheen .9s 1.75s ease-out both;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
/* ticker line */
.scorer-line{position:absolute;left:24px;right:24px;top:318px;height:38px;display:flex;align-items:center;gap:12px;padding-left:10px}
.scorer-line .tag{background:var(--hot);color:#060a14;font-weight:900;font-size:14px;line-height:1;padding:8px 14px;transform:skewX(-12deg);letter-spacing:.08em;animation:tag .4s 2.0s cubic-bezier(.23,1,.32,1) both}
.scorer-line .nm{font-weight:800;font-size:19px;letter-spacing:.03em;animation:nm .45s 2.1s cubic-bezier(.23,1,.32,1) both}
@keyframes tag{from{opacity:0;transform:translateX(-30px) skewX(-12deg)}to{opacity:1;transform:skewX(-12deg)}}
@keyframes nm{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.live{position:absolute;left:24px;top:22px;font-weight:900;font-size:13px;letter-spacing:.14em;display:flex;align-items:center;gap:8px;opacity:0;animation:fadein .3s .2s both}
.live i{width:9px;height:9px;border-radius:50%;background:#ff4d5e;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}@keyframes fadein{to{opacity:1}}
.strike{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:#ff5a6e;transform:scaleX(0);transform-origin:left;animation:strike .35s 1.65s cubic-bezier(.23,1,.32,1) both}
@keyframes strike{to{transform:scaleX(1)}}
body.no .title{font-size:70px;top:52px}
</style></head><body>
<div class="stage" id="st"><div class="grid"></div>
<div class="live"><i></i><span id="lv">LIVE</span></div>
<div class="title" id="ti"></div><div class="rule"></div>
<div class="bug">
 <div class="team home" id="th"><div class="logo" id="lh"></div><div class="code" id="ch"></div></div>
 <div class="mid"><div class="digit"><div class="reel" id="rh"></div></div><span class="sep">:</span><div class="digit"><div class="reel" id="ra"></div></div><div class="strike" id="sk" style="display:none"></div></div>
 <div class="team away" id="ta"><div class="logo" id="la"></div><div class="code" id="ca"></div></div>
</div>
<div class="scorer-line"><span class="tag" id="tg"></span><span class="nm" id="nm"></span></div>
<div class="flash"></div><div class="slab"></div><div class="slab s2"></div>
</div>
<script>
function setup(c){
 document.body.className=c.disallowed?'no':'';
 const word=c.disallowed?'NO GOAL':'GOAL';
 ti.innerHTML=[...word].map((ch,i)=>`<span style="--i:${i}">${ch===' '?'&nbsp;':ch}</span>`).join('');
 lv.textContent=(c.disallowed?'LIVE · VAR':'LIVE')+(c.minute?' · '+c.minute:'');
 ch.textContent=c.home;ca.textContent=c.away;lh.textContent=c.home[0];la.textContent=c.away[0];
 tg.textContent=c.disallowed?'VAR':'GOAL';nm.textContent=c.subtitle;
 const [ph,pa,nh,na]=[c.prev[0],c.prev[1],c.next[0],c.next[1]];
 rh.innerHTML=`<b>${ph}</b><b>${nh}</b>`;ra.innerHTML=`<b>${pa}</b><b>${na}</b>`;
 if(c.disallowed){sk.style.display='block'; if(nh!==ph) rh.classList.add('roll'); if(na!==pa) ra.classList.add('roll'); (nh!==ph?rh:ra).parentElement.classList.add('punch');}
 else{ if(nh!==ph){rh.classList.add('roll');th.classList.add('scorer')} if(na!==pa){ra.classList.add('roll');ta.classList.add('scorer')}}
 window.seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});
}
</script></body></html>
