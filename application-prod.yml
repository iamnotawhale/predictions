# Профиль prod: spring.profiles.active=prod (см. deploy/predicts.env)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/predicts_2
    username: admin

miniapp:
  dev-mode: false

# На проде не пересчитывать 60+ матчей при каждом рестарте (~40 с CPU/RAM)
predictions:
  startup:
    recalculate: false

logging:
  level:
    org:
      springframework:
        security: WARN
